[project]
name = "api-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.5",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "python-multipart>=0.0.9",
    # Phase 4: WebSocket fan-out. redis for pub/sub between replicas,
    # aiokafka to bridge telemetry.processed into it, cramjam because
    # aiokafka's lz4 codec needs it (Redpanda's own internal record
    # batches use lz4 -- see services/processor for the same dependency).
    "redis>=5.0",
    "aiokafka>=0.11",
    "cramjam>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Alembic autogenerates versions/*.py from the DB diff -- linting
# hand-written style onto generated code just means it gets re-messed on
# the next autogenerate. Same convention as excluding generated protobuf
# stubs.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
# B008: FastAPI's Depends()-in-default-argument is the documented DI
# pattern, not the footgun this rule targets (real mutable-default bugs).
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true

# aiokafka ships no inline type markers (same gap noted in
# services/processor's pyproject.toml, which has the identical override).
[[tool.mypy.overrides]]
module = "aiokafka.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"