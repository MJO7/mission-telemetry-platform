[project]
name = "processor"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiokafka>=0.11",
    "redis>=5.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    # aiokafka doesn't bundle codec support -- cramjam backs its lz4
    # codec, which Redpanda uses for its own internal/control record
    # batches, so the consumer needs it even if our own producers
    # never compress.
    "cramjam>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.setuptools.packages.find]
include = ["processor*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
# api-service's `app` package (installed editable alongside this one, see
# README) doesn't ship inline type markers as a separately-installed
# distribution -- strict mode would otherwise refuse to trust its types.
[[tool.mypy.overrides]]
module = "app.*"
ignore_missing_imports = true

# aiokafka ships no inline type markers either -- same reasoning as above.
[[tool.mypy.overrides]]
module = "aiokafka.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
