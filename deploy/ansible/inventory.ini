# ansible_ssh_private_key_file added beyond the literal spec: this
# targets a dedicated key generated just for this VM (mtp_key, gitignored),
# not a personal ~/.ssh/id_rsa reused across boxes -- Ansible has no way
# to find it without being told. IP is mtp-node's current one; re-check
# with `multipass info mtp-node` if this VM is ever recreated (Multipass
# assigns a fresh address each time).
[telemetry]
mtp-node ansible_host=192.168.252.3 ansible_user=ubuntu ansible_ssh_private_key_file=./mtp_key

[telemetry:vars]
ansible_python_interpreter=/usr/bin/python3
