[defaults]
inventory = inventory.ini
host_key_checking = False
# stdout_callback = yaml (the separate community.general.yaml plugin)
# was removed in community.general 12.0.0 -- confirmed on the actual
# installed version here (13.3.0), which refuses to start with it set.
# result_format=yaml on the builtin default callback is the documented
# replacement and produces the same readable per-task YAML output.
stdout_callback = default
[callback_default]
result_format = yaml
