server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: react-router owns client-side routing, so any path
    # nginx doesn't recognize as a real static file (e.g. /flights/abc)
    # must still serve index.html, not 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
