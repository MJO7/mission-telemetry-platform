# Bare node target for the k3s playbook (see k8s-build-progress memory
# for why Multipass specifically -- a real local VM that gets torn down
# and reprovisioned from nothing, not a cloud box costing money for a
# portfolio demo). Get the current IP with `multipass info mission-telemetry-node`
# if this VM was ever recreated -- Multipass assigns a fresh one each time.
[k3s_node]
mission-telemetry-node ansible_host=192.168.252.2 ansible_user=ubuntu ansible_ssh_private_key_file=./multipass_key
