# Template, not a real Secret -- deliberately not applied directly and
# not the file with real values in it (see .gitignore: k8s/base/secret.yaml
# is untracked). Committing a real secret's plaintext to git, even for a
# local demo cluster, is exactly the habit not worth practicing even
# once.
#
# Generate the real one with:
#   kubectl create secret generic api-secrets -n mission-telemetry \
#     --from-literal=API_DATABASE_URL="postgresql+asyncpg://telemetry:$(openssl rand -hex 16)@postgres-0.postgres:5432/telemetry" \
#     --from-literal=API_JWT_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=POSTGRES_PASSWORD="..." \
#     --dry-run=client -o yaml > k8s/base/secret.yaml
# (POSTGRES_PASSWORD must match whatever password is embedded in
# API_DATABASE_URL -- Postgres's own container reads it separately to
# set up the superuser password on first init.)
#
# processor reads API_DATABASE_URL too (it imports api-service's own
# Settings class -- see services/processor/README.md) but never touches
# API_JWT_SECRET, so one Secret object, mounted into both Deployments,
# is simpler than maintaining two.
apiVersion: v1
kind: Secret
metadata:
  name: api-secrets
  namespace: mission-telemetry
type: Opaque
stringData:
  API_DATABASE_URL: "postgresql+asyncpg://telemetry:CHANGE_ME@postgres-0.postgres:5432/telemetry"
  API_JWT_SECRET: "CHANGE_ME_32_BYTES_MINIMUM"
  POSTGRES_PASSWORD: "CHANGE_ME"
