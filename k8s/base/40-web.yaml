apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: mission-telemetry
spec:
  selector:
    app: web
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: mission-telemetry
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: mission-telemetry/web:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          # A static file server has no external dependency worth
          # gating readiness on -- liveness and readiness are the same
          # question here (is nginx up), unlike the two backend
          # services above.
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          # Measured baseline (docker stats, idle nginx container): ~9.4MB.
          # See k8s/README.md.
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
