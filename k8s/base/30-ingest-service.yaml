apiVersion: v1
kind: Service
metadata:
  name: ingest-service
  namespace: mission-telemetry
spec:
  selector:
    app: ingest-service
  ports:
    - port: 8081
      targetPort: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingest-service
  namespace: mission-telemetry
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: ingest-service
  template:
    metadata:
      labels:
        app: ingest-service
    spec:
      containers:
        - name: ingest-service
          image: mission-telemetry/ingest-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: ingest-config
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          # Gated on a real Kafka dial (handlers.go's handleReadyz), not
          # just "is the goroutine scheduler alive" -- an instance that
          # can't reach Redpanda would otherwise keep accepting HTTP
          # requests it can only ever route to the DLQ or drop.
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          # Same endpoint-propagation race as api-service (see that
          # manifest's comment, and k8s/README.md's rollout demo) --
          # this service's own graceful shutdown (main.go's SIGTERM
          # handler) was never the gap; the Service's Endpoints list
          # catching up before SIGTERM lands is.
          # Native kubelet-level sleep (K8s 1.29+), not exec: this image
          # is distroless (no shell, no coreutils, see the Dockerfile) --
          # `exec: ["sleep","5"]` would fail at runtime with nothing to
          # exec. The sleep action is implemented by the kubelet itself,
          # so it needs nothing inside the container at all.
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          # Measured baseline (ps RSS, idle): ~9.4MB -- a static Go
          # binary with a small worker pool and no framework overhead.
          # See k8s/README.md.
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
